<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketIntel | Premium Multi-Asset Trading Platform & AI Analytics</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="MarketIntel | Premium Multi-Asset Trading Platform & AI Analytics" />
    <meta name="description" content="Trade global stocks, crypto, forex, derivatives, and ETFs with zero commissions, real-time market streams, ultra-fast order matching, and AI-driven market intelligence." />
    <meta name="keywords" content="MarketIntel, broker, stock trading, crypto exchange, AI market intelligence, online brokerage, tradingview charts, zero commission" />
    <meta name="author" content="MarketIntel Technologies" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marketintel.io/" />
    <meta property="og:title" content="MarketIntel | Premium Multi-Asset Trading Platform & AI Analytics" />
    <meta property="og:description" content="Execute trades across stocks, crypto, and derivatives with real-time streaming data and institutional AI market intelligence." />
    <meta property="og:image" content="%PUBLIC_URL%/media/homeHero.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://marketintel.io/" />
    <meta property="twitter:title" content="MarketIntel | Premium Multi-Asset Trading Platform" />
    <meta property="twitter:description" content="Trade global stocks, crypto, and ETFs with zero commissions and real-time AI intelligence." />
    <meta property="twitter:image" content="%PUBLIC_URL%/media/homeHero.png" />

    <!-- AIEO (AI Engine Optimization) - JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialProduct",
      "name": "MarketIntel Trading Platform",
      "description": "Institutional-grade multi-asset trading platform providing zero-latency order execution and AI market intelligence.",
      "provider": {
        "@type": "Organization",
        "name": "MarketIntel Broking Ltd.",
        "url": "https://marketintel.io"
      },
      "feesAndCommissionsSpecification": "Zero-commission equity trades and competitive crypto fees."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MarketIntel Terminal",
      "operatingSystem": "Web, iOS, Android",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run MarketIntel App.</noscript>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
